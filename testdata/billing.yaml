openapi: 3.0.3
info:
  title: Billing API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:7070
paths:
  /invoices/{id}:
    get:
      operationId: billing.invoice
      summary: Get invoice by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One invoice
