openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /orders:
    get:
      operationId: orders.list
      summary: List orders
      responses:
        "200":
          description: Order list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
          links:
            getOrder:
              operationId: orders.get
  /orders/{id}:
    get:
      operationId: orders.get
      summary: Get order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
          links:
            deleteOrder:
              operationRef: "#/paths/~1orders~1{id}/delete"
    delete:
      operationId: orders.delete
      summary: Delete order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: string
        customerId:
          type: string
