openapi: 3.0.3
info:
  title: Teams API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:9090
paths:
  /teams/{id}:
    get:
      operationId: teams.get
      summary: Get team by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One team
