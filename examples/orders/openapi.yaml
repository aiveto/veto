openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:8080
paths:
  /orders/{id}:
    delete:
      operationId: orders.delete
      summary: Delete order
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
