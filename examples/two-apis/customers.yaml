openapi: 3.0.3
info:
  title: Customers API
  version: 1.0.0
servers:
  - url: http://127.0.0.1:9090
security:
  - bearerAuth: []
paths:
  /customers/{id}:
    get:
      operationId: customers.get
      summary: Get customer by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: One customer
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
