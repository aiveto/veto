version: "2"

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - durationcheck
    - errchkjson
    - errorlint
    - fatcontext
    - makezero
    - nilerr
    - nilnesserr
    - noctx
    - reassign
    - unconvert
    - wastedassign
