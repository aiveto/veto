version: 2

project_name: veto

builds:
  - main: ./cmd/veto
    binary: veto
    env:
      - CGO_ENABLED=0
    ldflags:
      - -X github.com/aiveto/veto/mcpserver.Version={{.Version}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc

brews:
  - name: veto
    homepage: https://github.com/aiveto/veto
    description: Turn OpenAPI services into tools an agent can call under your rules.
    license: Apache-2.0
    repository:
      owner: aiveto
      name: homebrew-veto
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Formula
    test: |
      system "#{bin}/veto", "--help"
