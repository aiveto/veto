    <marker id="veto-runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1916"/>
    </marker>
  </defs>
  <rect width="736" height="628" fill="#F4F1EA"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#1A1916">
