    <text x="588" y="456" text-anchor="middle" fill="#5C5854" font-size="12">for approval</text>
    <line x1="588" y1="464" x2="588" y2="532" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="588" y1="532" x2="500" y2="532" stroke="#1A1916" stroke-width="1.5"/>
