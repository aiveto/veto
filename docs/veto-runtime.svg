<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1180" viewBox="0 0 800 1180" role="img" aria-labelledby="veto-runtime-title">
  <title id="veto-runtime-title">Claude, Cursor, or ChatGPT talks to veto over MCP. A CLI or Go client enters at invoke. Search, describe, and invoke sit on catalog, semantics, relations, and a short brief that is not the OpenAPI file. Destructive calls can be configured for approval. Then HTTP reaches your APIs.</title>
  <defs>
    <marker id="veto-runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1916"/>
    </marker>
  </defs>
  <rect width="800" height="1180" fill="#F4F1EA"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#1A1916">
    <rect x="52" y="24" width="328" height="88" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
    <text x="216" y="60" text-anchor="middle" font-size="24" font-weight="650">Agent</text>
    <text x="216" y="90" text-anchor="middle" font-size="16" fill="#5C5854">Claude, Cursor, ChatGPT</text>

    <rect x="420" y="24" width="328" height="88" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
    <text x="584" y="60" text-anchor="middle" font-size="22" font-weight="650">CLI / Go client</text>
    <text x="584" y="90" text-anchor="middle" font-size="15" fill="#5C5854">you, a script, or a skill</text>

    <line x1="216" y1="112" x2="216" y2="140" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="216" y1="140" x2="400" y2="140" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="400" y1="140" x2="400" y2="164" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <text x="228" y="134" font-size="16" fill="#5C5854">MCP</text>

    <line x1="584" y1="112" x2="636" y2="148" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="636" y1="148" x2="636" y2="164" stroke="#1A1916" stroke-width="1.75"/>

    <rect x="28" y="164" width="744" height="820" rx="14" fill="#E8E2D6" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="636" y1="164" x2="636" y2="228" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <text x="400" y="206" text-anchor="middle" font-size="26" font-weight="650">veto</text>

    <rect x="52" y="228" width="224" height="128" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="164" y="282" text-anchor="middle" font-size="24" font-weight="650">search</text>
    <text x="164" y="316" text-anchor="middle" font-size="18" fill="#5C5854">find an operation</text>

    <rect x="288" y="228" width="224" height="128" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="400" y="282" text-anchor="middle" font-size="24" font-weight="650">describe</text>
    <text x="400" y="316" text-anchor="middle" font-size="18" fill="#5C5854">see the operation</text>

    <rect x="524" y="228" width="224" height="128" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="636" y="282" text-anchor="middle" font-size="24" font-weight="650">invoke</text>
    <text x="636" y="316" text-anchor="middle" font-size="18" fill="#5C5854">request the call</text>

    <line x1="164" y1="356" x2="164" y2="392" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="400" y1="356" x2="400" y2="392" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="636" y1="356" x2="636" y2="392" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="164" y1="392" x2="636" y2="392" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="400" y1="392" x2="400" y2="420" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>

    <rect x="52" y="428" width="696" height="336" rx="10" fill="#D3EEF0" stroke="#1A1916" stroke-width="1.75"/>
    <text x="400" y="468" text-anchor="middle" font-size="22" font-weight="650">context</text>

    <rect x="72" y="488" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="236" y="538" text-anchor="middle" font-size="22" font-weight="650">catalog</text>
    <text x="236" y="574" text-anchor="middle" font-size="18" fill="#5C5854">from your OpenAPI</text>

    <rect x="416" y="488" width="312" height="120" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="572" y="538" text-anchor="middle" font-size="22" font-weight="650">semantics</text>
    <text x="572" y="574" text-anchor="middle" font-size="18" fill="#5C5854">retire finds delete</text>

    <rect x="72" y="624" width="328" height="120" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="236" y="674" text-anchor="middle" font-size="22" font-weight="650">relations</text>
    <text x="236" y="710" text-anchor="middle" font-size="18" fill="#5C5854">field to operation</text>

    <rect x="416" y="624" width="312" height="120" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="572" y="674" text-anchor="middle" font-size="22" font-weight="650">the brief</text>
    <text x="572" y="710" text-anchor="middle" font-size="18" fill="#5C5854">not the OpenAPI file</text>

    <line x1="636" y1="764" x2="636" y2="792" stroke="#1A1916" stroke-width="1.75"/>
    <rect x="524" y="792" width="224" height="100" rx="8" fill="#F4D4C4" stroke="#1A1916" stroke-width="1.75"/>
    <text x="636" y="832" text-anchor="middle" font-size="18" font-weight="650">Destructive calls</text>
    <text x="636" y="860" text-anchor="middle" font-size="14" fill="#5C5854">can be configured</text>
    <text x="636" y="880" text-anchor="middle" font-size="14" fill="#5C5854">for approval</text>

    <line x1="636" y1="892" x2="636" y2="948" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="636" y1="948" x2="400" y2="948" stroke="#1A1916" stroke-width="1.75"/>
    <text x="518" y="936" text-anchor="middle" font-size="18" font-weight="650">HTTP</text>
  </g>
  <line x1="400" y1="948" x2="400" y2="1028" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
  <rect x="220" y="1040" width="360" height="88" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
  <text x="400" y="1094" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="650" fill="#1A1916">Your APIs</text>
</svg>
