<svg xmlns="http://www.w3.org/2000/svg" width="860" height="920" viewBox="0 0 860 920" role="img" aria-labelledby="veto-runtime-title">
  <title id="veto-runtime-title">Claude, Cursor, or ChatGPT talks to veto over MCP. A CLI or script uses search, describe, and invoke. Search and describe read the catalog. Only invoke runs policy, confirmation, and HTTP.</title>
  <defs>
    <marker id="veto-runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1916"/>
    </marker>
  </defs>
  <rect width="860" height="920" fill="#F4F1EA"/>
  <g font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" fill="#1A1916">
    <rect x="52" y="20" width="328" height="80" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
    <text x="216" y="54" text-anchor="middle" font-size="24" font-weight="650">Agent</text>
    <text x="216" y="80" text-anchor="middle" font-size="16" fill="#5C5854">Claude, Cursor, ChatGPT</text>

    <rect x="480" y="20" width="328" height="80" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
    <text x="644" y="54" text-anchor="middle" font-size="22" font-weight="650">CLI / script</text>
    <text x="644" y="80" text-anchor="middle" font-size="15" fill="#5C5854">search, describe, invoke</text>

    <line x1="216" y1="100" x2="216" y2="148" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <line x1="644" y1="100" x2="644" y2="148" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <text x="228" y="130" font-size="16" fill="#5C5854">MCP</text>
    <text x="608" y="130" text-anchor="end" font-size="16" fill="#5C5854">CLI</text>

    <rect x="28" y="148" width="804" height="560" rx="14" fill="#E8E2D6" stroke="#1A1916" stroke-width="1.75"/>
    <text x="430" y="186" text-anchor="middle" font-size="26" font-weight="650">veto</text>

    <rect x="52" y="204" width="224" height="104" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="164" y="250" text-anchor="middle" font-size="24" font-weight="650">search</text>
    <text x="164" y="280" text-anchor="middle" font-size="16" fill="#5C5854">find an operation</text>

    <rect x="288" y="204" width="224" height="104" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="400" y="250" text-anchor="middle" font-size="24" font-weight="650">describe</text>
    <text x="400" y="280" text-anchor="middle" font-size="16" fill="#5C5854">see the operation</text>

    <rect x="524" y="204" width="224" height="104" rx="10" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.75"/>
    <text x="636" y="250" text-anchor="middle" font-size="24" font-weight="650">invoke</text>
    <text x="636" y="280" text-anchor="middle" font-size="16" fill="#5C5854">request the call</text>

    <line x1="164" y1="308" x2="164" y2="344" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <line x1="400" y1="308" x2="400" y2="344" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>

    <rect x="52" y="344" width="676" height="200" rx="10" fill="#D3EEF0" stroke="#1A1916" stroke-width="1.75"/>
    <rect x="72" y="364" width="200" height="160" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="172" y="430" text-anchor="middle" font-size="20" font-weight="650">catalog</text>
    <text x="172" y="462" text-anchor="middle" font-size="15" fill="#5C5854">from your OpenAPI</text>

    <rect x="288" y="364" width="200" height="160" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="388" y="430" text-anchor="middle" font-size="20" font-weight="650">semantics</text>
    <text x="388" y="462" text-anchor="middle" font-size="15" fill="#5C5854">retire finds delete</text>

    <rect x="504" y="364" width="200" height="160" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.25"/>
    <text x="604" y="430" text-anchor="middle" font-size="20" font-weight="650">relations</text>
    <text x="604" y="462" text-anchor="middle" font-size="15" fill="#5C5854">field to operation</text>

    <line x1="748" y1="256" x2="808" y2="256" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="808" y1="256" x2="808" y2="632" stroke="#1A1916" stroke-width="1.75"/>
    <line x1="808" y1="632" x2="729" y2="632" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
    <rect x="480" y="588" width="240" height="88" rx="8" fill="#F4D4C4" stroke="#1A1916" stroke-width="1.75"/>
    <text x="600" y="624" text-anchor="middle" font-size="18" font-weight="650">Policy + confirmation</text>
    <text x="600" y="652" text-anchor="middle" font-size="14" fill="#5C5854">Deletes require approval by default</text>
  </g>
  <line x1="600" y1="676" x2="600" y2="752" stroke="#1A1916" stroke-width="1.75"/>
  <line x1="600" y1="752" x2="400" y2="752" stroke="#1A1916" stroke-width="1.75"/>
  <text x="500" y="734" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="650" fill="#1A1916">HTTP</text>
  <line x1="400" y1="752" x2="400" y2="796" stroke="#1A1916" stroke-width="1.75" marker-end="url(#veto-runtime-arrow)"/>
  <rect x="220" y="804" width="360" height="80" rx="10" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.75"/>
  <text x="400" y="852" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="26" font-weight="650" fill="#1A1916">Your APIs</text>
</svg>
