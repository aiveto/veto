    <rect x="268" y="132" width="200" height="88" rx="8" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.5"/>
    <text x="368" y="170" text-anchor="middle" font-weight="600">describe</text>
    <text x="368" y="194" text-anchor="middle" fill="#5C5854" font-size="12">see the operation</text>
    <rect x="488" y="132" width="200" height="88" rx="8" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.5"/>
