    <line x1="368" y1="244" x2="368" y2="260" stroke="#1A1916" stroke-width="1.5" marker-end="url(#veto-runtime-arrow)"/>
    <rect x="48" y="264" width="640" height="116" rx="8" fill="#D3EEF0" stroke="#1A1916" stroke-width="1.5"/>
    <text x="368" y="288" text-anchor="middle" font-weight="600">context</text>
