<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 860" role="img" aria-labelledby="veto-runtime-title">
  <title id="veto-runtime-title">Claude, Cursor, or ChatGPT talks to veto over MCP. Search, describe, and invoke sit on catalog, semantics, relations, and a short brief that is not the OpenAPI file. Destructive calls can be configured for approval. Then HTTP reaches your APIs.</title>
  <defs>
    <marker id="veto-runtime-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1A1916"/>
    </marker>
  </defs>
  <rect width="1280" height="860" fill="#F4F1EA"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" fill="#1A1916">
    <rect x="440" y="20" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.5"/>
    <text x="640" y="44" text-anchor="middle" font-weight="600">Agent</text>
    <text x="640" y="64" text-anchor="middle" fill="#5C5854" font-size="13">Claude, Cursor, ChatGPT</text>
    <line x1="640" y1="76" x2="640" y2="104" stroke="#1A1916" stroke-width="1.5" marker-end="url(#veto-runtime-arrow)"/>
    <text x="654" y="96" fill="#5C5854" font-size="13">MCP</text>
    <rect x="48" y="112" width="1184" height="468" rx="12" fill="#E8E2D6" stroke="#1A1916" stroke-width="1.5"/>
    <text x="640" y="140" text-anchor="middle" font-weight="600">veto</text>
    <rect x="80" y="160" width="357" height="104" rx="8" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.5"/>
    <text x="258" y="204" text-anchor="middle" font-weight="600">search</text>
    <text x="258" y="230" text-anchor="middle" fill="#5C5854" font-size="13">find an operation</text>
    <rect x="461" y="160" width="357" height="104" rx="8" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.5"/>
    <text x="639" y="204" text-anchor="middle" font-weight="600">describe</text>
    <text x="639" y="230" text-anchor="middle" fill="#5C5854" font-size="13">see the operation</text>
    <rect x="842" y="160" width="357" height="104" rx="8" fill="#D7E4F2" stroke="#1A1916" stroke-width="1.5"/>
    <text x="1020" y="204" text-anchor="middle" font-weight="600">invoke</text>
    <text x="1020" y="230" text-anchor="middle" fill="#5C5854" font-size="13">request the call</text>
    <line x1="258" y1="264" x2="258" y2="292" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="639" y1="264" x2="639" y2="292" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="1020" y1="264" x2="1020" y2="292" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="258" y1="292" x2="1020" y2="292" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="639" y1="292" x2="639" y2="312" stroke="#1A1916" stroke-width="1.5" marker-end="url(#veto-runtime-arrow)"/>
    <rect x="80" y="320" width="1119" height="148" rx="8" fill="#D3EEF0" stroke="#1A1916" stroke-width="1.5"/>
    <text x="640" y="348" text-anchor="middle" font-weight="600">context</text>
    <rect x="96" y="364" width="260" height="84" rx="6" fill="#FFFFFF" stroke="#1A1916" stroke-width="1"/>
    <text x="226" y="398" text-anchor="middle" font-weight="600">catalog</text>
    <text x="226" y="422" text-anchor="middle" fill="#5C5854" font-size="13">from your OpenAPI</text>
    <rect x="372" y="364" width="260" height="84" rx="6" fill="#FFFFFF" stroke="#1A1916" stroke-width="1"/>
    <text x="502" y="398" text-anchor="middle" font-weight="600">semantics</text>
    <text x="502" y="422" text-anchor="middle" fill="#5C5854" font-size="13">retire finds delete</text>
    <rect x="648" y="364" width="260" height="84" rx="6" fill="#FFFFFF" stroke="#1A1916" stroke-width="1"/>
    <text x="778" y="398" text-anchor="middle" font-weight="600">relations</text>
    <text x="778" y="422" text-anchor="middle" fill="#5C5854" font-size="13">field to operation</text>
    <rect x="924" y="364" width="259" height="84" rx="6" fill="#FFFFFF" stroke="#1A1916" stroke-width="1"/>
    <text x="1053" y="398" text-anchor="middle" font-weight="600">the brief</text>
    <text x="1053" y="422" text-anchor="middle" fill="#5C5854" font-size="13">not the OpenAPI file</text>
    <line x1="1020" y1="468" x2="1020" y2="492" stroke="#1A1916" stroke-width="1.5"/>
    <rect x="842" y="492" width="357" height="72" rx="6" fill="#F4D4C4" stroke="#1A1916" stroke-width="1.5"/>
    <text x="1020" y="520" text-anchor="middle" font-weight="600">Destructive calls</text>
    <text x="1020" y="544" text-anchor="middle" fill="#5C5854" font-size="13">can be configured for approval</text>
    <line x1="1020" y1="564" x2="1020" y2="688" stroke="#1A1916" stroke-width="1.5"/>
    <line x1="1020" y1="688" x2="640" y2="688" stroke="#1A1916" stroke-width="1.5"/>
    <text x="830" y="678" text-anchor="middle" font-weight="600">HTTP</text>
    <line x1="640" y1="688" x2="640" y2="756" stroke="#1A1916" stroke-width="1.5" marker-end="url(#veto-runtime-arrow)"/>
    <rect x="440" y="768" width="400" height="56" rx="8" fill="#FFFFFF" stroke="#1A1916" stroke-width="1.5"/>
    <text x="640" y="802" text-anchor="middle" font-weight="600">Your APIs</text>
  </g>
</svg>
